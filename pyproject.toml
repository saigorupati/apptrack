[project]
name = "apptrack"
version = "0.1.0"
description = "Nightly job-application email tracker: Gmail -> classify -> Google Sheet + digest"
requires-python = ">=3.12"
dependencies = [
    "imapclient>=3.0",
    "gspread>=6.0",
    "google-auth>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
